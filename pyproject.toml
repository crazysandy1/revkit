[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revkit"
version = "1.0.0"
description = "Programmable reverse-engineering platform: loaders, disassembler, decompiler, debugger, scripting, plugins, collaboration"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["reverse-engineering", "disassembler", "decompiler", "binary-analysis"]
dependencies = [
  "capstone>=5.0",
  "keystone-engine>=0.9.2",
  "pefile>=2023.2.7",
  "pyelftools>=0.30",
  "unicorn>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
revkit = "revkit.cli:main"

[tool.setuptools.packages.find]
include = ["revkit*"]

[tool.setuptools.package-data]
revkit = ["typelibs/*.h", "web/static/*", "plugins/builtin/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
